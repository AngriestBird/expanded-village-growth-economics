name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check language files
        run: python3 tools/check_lang.py

      - name: Build package
        run: python3 make_tar.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: renewed-village-growth
          path: Renewed_Village_Growth-*.tar
