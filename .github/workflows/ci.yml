name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install Squirrel interpreter
        run: sudo apt-get update && sudo apt-get install -y squirrel3

      - name: Compile scripts and run unit tests
        run: python3 tools/run_tests.py

      - name: Check language files
        run: python3 tools/check_lang.py

      - name: Build package
        run: python3 make_tar.py

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-village-growth-economics
          path: Expanded_Village_Growth_Economics-*.tar
