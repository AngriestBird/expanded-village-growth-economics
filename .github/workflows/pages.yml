name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manual page from readme.txt
        run: |
          {
            echo '---'
            echo 'title: Expanded Village Growth + Economics Readme'
            echo 'description: "Manual and game settings from the bundled readme.txt"'
            echo '---'
            echo
            echo '# Expanded Village Growth + Economics Readme'
            echo
            echo '```text'
            cat readme.txt
            echo '```'
          } > docs/readme.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: docs/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
