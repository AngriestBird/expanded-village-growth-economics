name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manual page from readme.txt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("readme.txt").read_text().splitlines()
          out = [
              "---",
              "title: Expanded Village Growth + Economics Readme",
              "description: \"Manual and game settings from the bundled readme.txt\"",
              "---",
              "",
          ]

          header = re.compile(r"^[1-6]\.\s+.*$")
          for line in lines:
              match = header.match(line)
              if match:
                  out.append(f"## {line}")
              else:
                  out.append(line)

          Path("docs/readme.md").write_text("\n".join(out) + "\n")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: docs/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
