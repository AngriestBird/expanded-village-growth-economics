name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Read and validate tag against src/version.nut
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]

          version_text = Path("src/version.nut").read_text(encoding="utf-8")
          major = re.search(r"SELF_MAJORVERSION\s*<-\s*(\d+)", version_text)
          minor = re.search(r"SELF_MINORVERSION\s*<-\s*(\d+)", version_text)
          patch = re.search(r"SELF_PATCHVERSION\s*<-\s*(\d+)", version_text)

          if major is None or minor is None:
              raise SystemExit("Could not read SELF_MAJORVERSION or SELF_MINORVERSION from src/version.nut")

          patch_version = patch.group(1) if patch is not None else "0"
          expected = f"v{major.group(1)}.{minor.group(1)}.{patch_version}"
          beta_pattern = re.compile(rf"^{re.escape(expected)}-beta(?:\.[0-9A-Za-z-]+)*$")
          if tag != expected and not beta_pattern.match(tag):
              raise SystemExit(
                  f"Tag {tag} does not match src/version.nut {expected}. "
                  "Expected tag format: "
                  f"{expected} or {expected}-beta[.<suffix>]"
              )

          is_prerelease = tag.startswith(f"{expected}-beta")
          tar_file = f"Expanded_Village_Growth_Economics-{major.group(1)}.{minor.group(1)}.{patch_version}.tar"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"expected={expected}\n")
              out.write(f"tar_file={tar_file}\n")
              out.write(f"is_prerelease={str(is_prerelease).lower()}\n")
          PY

      - name: Check language files
        run: python3 tools/check_lang.py

      - name: Build package
        run: python3 make_tar.py

      - name: Verify built tarball exists
        id: artifact
        run: |
          tar_file="${{ steps.version.outputs.tar_file }}"
          if [[ ! -f "$tar_file" ]]; then
            echo "Expected tarball '$tar_file' was not found."
            ls -1 Expanded_Village_Growth_Economics-*.tar || true
            exit 1
          fi
          echo "tar_file=$tar_file" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-village-growth-economics-tarball
          path: ${{ steps.artifact.outputs.tar_file }}

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: "${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          body: |
            Release ${{ github.ref_name }}.
            Tarball attached for this tag.
          files: ${{ steps.artifact.outputs.tar_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
